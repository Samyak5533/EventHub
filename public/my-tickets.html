<!DOCTYPE html>
<html lang="en">
<head>
  <title>My tickets — EventHub</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#05080f" />
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="/css/styles.css" rel="stylesheet" />
  <link href="/css/animations.css" rel="stylesheet" />
  <script src="/js/common.js"></script>
</head>
<body>
  <div class="bg-aurora" aria-hidden="true"><span></span><span></span><span></span></div>
  <div class="bg-grid" aria-hidden="true"></div>

  <header class="nav-wrap">
    <nav class="nav glass" aria-label="Main">
      <a class="brand" href="/"><span class="brand-mark"><i class="bi bi-ticket-perforated-fill"></i></span>EventHub</a>
      <div class="nav-links">
        <a href="/">Events</a>
        <a href="/my-tickets.html" class="is-active">My tickets</a>
      </div>
      <div class="nav-actions">
        <button id="themeToggle" class="theme-toggle" type="button"></button>
        <span class="user-chip hide-sm" id="userChip"></span>
        <button type="button" class="theme-toggle" data-logout="/login.html" aria-label="Log out" title="Log out"><i class="bi bi-box-arrow-right"></i></button>
      </div>
    </nav>
  </header>

  <main class="container-xl">
    <section class="page-head">
      <span class="eyebrow rise"><i class="bi bi-ticket-perforated"></i>Your wallet</span>
      <h1 data-split>My tickets</h1>
      <p class="rise" style="--delay:300ms" id="ticketSummary">Show the QR code at the door. Each one works once.</p>
    </section>

    <div id="ticketsList" class="d-flex flex-column gap-4 pb-5">
      <div class="skeleton-card" style="height:180px"><div class="skeleton" style="height:100%"></div></div>
      <div class="skeleton-card" style="height:180px"><div class="skeleton" style="height:100%"></div></div>
    </div>
  </main>

  <footer class="footer">
    <div class="container-xl footer-bottom" style="margin-top:0;border:0;padding-top:0">
      <span>© 2026 EventHub</span>
      <a href="/">Find more events →</a>
    </div>
  </footer>

  <div class="toast-container" id="toastContainer" aria-live="polite"></div>
  <script src="/js/my-tickets.js"></script>
</body>
</html>
