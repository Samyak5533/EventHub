<!DOCTYPE html>
<html lang="en">
<head>
  <title>Payment — EventHub</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#05080f" />
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="/css/styles.css" rel="stylesheet" />
  <link href="/css/animations.css" rel="stylesheet" />
  <script src="/js/common.js"></script>
</head>
<body>
  <div class="bg-aurora" aria-hidden="true"><span></span><span></span><span></span></div>
  <div class="bg-grid" aria-hidden="true"></div>

  <main class="center-screen">
    <div class="status-card glass pop" aria-live="polite">
      <div id="statusIcon"><div class="spinner-border" style="width:3.5rem;height:3.5rem;color:var(--primary)" role="status"></div></div>
      <h1 id="statusTitle">Confirming your booking…</h1>
      <p id="statusMsg">Hang tight while we check the payment and issue your tickets.</p>
      <div id="progress" class="loading-bar"><span></span></div>
      <div id="actions" class="mt-4 d-none">
        <a href="/my-tickets.html" class="button button--primary button--block button--lg"><i class="bi bi-ticket-perforated"></i>View my tickets</a>
        <a href="/" class="d-block mt-3 text-muted small">← Browse more events</a>
      </div>
    </div>
  </main>
  <script src="/js/payment-success.js"></script>
</body>
</html>
