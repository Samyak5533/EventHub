<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login — EventHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/styles.css" rel="stylesheet" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="brand">🎟 EventHub</div>
        <p>Discover and book events near you</p>
      </div>

      <h2>Welcome back</h2>
      <p class="subtitle">Sign in to access your tickets and bookings</p>

      <div id="alert" class="alert alert-danger d-none py-2 mb-3" style="border-radius:10px;font-size:0.875rem"></div>

      <div class="form-group">
        <label class="form-label">Email Address</label>
        <div class="input-wrapper">
          <span class="input-icon">✉️</span>
          <input id="email" type="email" class="form-input" placeholder="you@email.com" autocomplete="email" />
        </div>
      </div>

      <div class="form-group">
        <div class="d-flex justify-content-between align-items-center">
          <label class="form-label">Password</label>
        </div>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input id="password" type="password" class="form-input" placeholder="Enter your password" autocomplete="current-password" />
        </div>
      </div>

      <button id="btnLogin" type="button" style="display:block;width:100%;background:linear-gradient(135deg,#6C63FF,#FF6584);color:white;border:none;border-radius:12px;padding:0.8rem;font-size:1rem;font-weight:700;cursor:pointer;margin-top:0.5rem;box-shadow:0 4px 15px rgba(108,99,255,0.35);">Sign In to EventHub</button>

      <div class="auth-divider">or</div>

      <div class="auth-footer">
        Don't have an account?
        <a href="/register.html" class="fw-700" style="color:var(--primary)">Create one free →</a>
      </div>

      <div class="text-center mt-3">
        <a href="/" style="font-size:0.8rem;color:var(--text-muted)">← Back to Events</a>
      </div>
    </div>
  </div>

  <!-- Toast container -->
  <div class="toast-container" id="toastContainer"></div>

  <script>
    function showToast(message, type = 'info') {
      const icons = { success: '✅', error: '❌', info: 'ℹ️', warning: '⚠️' };
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast-item toast-${type}`;
      toast.innerHTML = `<span class="toast-icon">${icons[type]}</span><span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => { toast.style.animation = 'toastOut 0.3s ease forwards'; setTimeout(() => toast.remove(), 300); }, 3500);
    }

    async function doLogin() {
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('password').value;
      const alertEl = document.getElementById('alert');
      const btn = document.getElementById('btnLogin');
      alertEl.classList.add('d-none');

      if (!email || !pass) {
        alertEl.textContent = 'Please enter your email and password.';
        alertEl.classList.remove('d-none');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Signing in...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password: pass })
        });
        const j = await res.json();
        if (j.token) {
          sessionStorage.setItem('token', j.token);
          showToast(`Welcome back, ${j.user?.name || 'User'}! 🎉`, 'success');
          setTimeout(() => {
            const payload = JSON.parse(atob(j.token.split('.')[1]));
            window.location = payload.role === 'admin' ? '/admin.html' : '/';
          }, 800);
        } else {
          alertEl.textContent = j.message || 'Invalid email or password';
          alertEl.classList.remove('d-none');
          btn.disabled = false;
          btn.textContent = 'Sign In to EventHub';
        }
      } catch {
        alertEl.textContent = 'Server error. Please try again.';
        alertEl.classList.remove('d-none');
        btn.disabled = false;
        btn.textContent = 'Sign In to EventHub';
      }
    }

    document.getElementById('btnLogin').addEventListener('click', doLogin);
    document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

    // Redirect if already logged in
    if (sessionStorage.getItem('token')) window.location = '/';
  </script>
</body>
</html>
