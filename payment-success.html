<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Payment Successful — EventHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/styles.css" rel="stylesheet" />
  <style>
    body { background: linear-gradient(135deg, #0F0F1A 0%, #1a1040 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .success-card { background: white; border-radius: 24px; padding: 3rem; max-width: 480px; width: 100%; text-align: center; box-shadow: 0 30px 80px rgba(0,0,0,0.3); }
    .success-icon { font-size: 4rem; animation: bounce 0.6s ease; }
    @keyframes bounce { 0%,100%{transform:scale(1)} 50%{transform:scale(1.2)} }
    .progress-bar-thin { height: 4px; background: var(--border); border-radius: 999px; overflow: hidden; margin-top: 1.5rem; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent)); animation: fillbar 3s linear forwards; }
    @keyframes fillbar { from{width:0%} to{width:100%} }
  </style>
</head>
<body>
  <div class="success-card">
    <div class="success-icon" id="statusIcon">⏳</div>
    <h2 class="fw-800 mt-3" id="statusTitle">Finalizing your booking...</h2>
    <p class="text-muted" id="statusMsg">Please wait while we confirm your payment and issue your tickets.</p>
    <div id="progressArea" class="progress-bar-thin"><div class="progress-fill"></div></div>
    <div id="actionArea" class="mt-4 d-none">
      <a href="/my-tickets.html" class="btn-auth d-block rounded-3 text-decoration-none">🎟 View My Tickets</a>
      <a href="/" class="d-block mt-3 text-muted small">← Browse More Events</a>
    </div>
  </div>

  <script>
    async function finalize() {
      const params = new URLSearchParams(window.location.search);
      const session_id = params.get('session_id');

      if (!session_id) {
        document.getElementById('statusIcon').textContent = '❌';
        document.getElementById('statusTitle').textContent = 'Invalid Payment Link';
        document.getElementById('statusMsg').textContent = 'No session ID found. Please try booking again.';
        document.getElementById('progressArea').style.display = 'none';
        return;
      }

      try {
        const res = await fetch('/api/payments/confirm?session_id=' + session_id, {
          headers: sessionStorage.getItem('token') ? { 'Authorization': 'Bearer ' + sessionStorage.getItem('token') } : {}
        });
        const data = await res.json();

        if (res.ok) {
          document.getElementById('statusIcon').textContent = '✅';
          document.getElementById('statusTitle').textContent = 'Payment Successful!';
          document.getElementById('statusMsg').textContent = 'Your tickets have been issued with unique QR codes. Show them at the door!';
          document.getElementById('actionArea').classList.remove('d-none');
          // Auto redirect after 3 seconds
          setTimeout(() => window.location = '/my-tickets.html', 3000);
        } else {
          document.getElementById('statusIcon').textContent = '⚠️';
          document.getElementById('statusTitle').textContent = 'Booking Note';
          document.getElementById('statusMsg').textContent = data.message || 'Payment received. Check your tickets.';
          document.getElementById('actionArea').classList.remove('d-none');
        }
      } catch {
        document.getElementById('statusIcon').textContent = '❌';
        document.getElementById('statusTitle').textContent = 'Connection Error';
        document.getElementById('statusMsg').textContent = 'Could not confirm booking. Please check My Tickets or contact support.';
        document.getElementById('actionArea').classList.remove('d-none');
      }
    }

    finalize();
  </script>
</body>
</html>
