<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QR Scanner — EventHub Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/styles.css" rel="stylesheet" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid px-4">
      <a class="navbar-brand" href="/">🎟 EventHub</a>
      <div class="d-flex align-items-center gap-2">
        <a href="/admin.html" class="btn btn-sm btn-nav-login">← Admin Panel</a>
        <button onclick="doLogout()" class="btn btn-sm" style="background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.6);border:1px solid rgba(255,255,255,0.15);border-radius:20px;font-size:0.78rem;padding:0.25rem 0.9rem">Logout</button>
      </div>
    </div>
  </nav>

  <div class="scanner-page">
    <div class="container">
      <div class="text-center mb-4">
        <h1 style="color:var(--text);font-weight:800;font-size:1.75rem">📷 Ticket QR Scanner</h1>
        <p style="color:var(--text-muted)">Scan attendee QR codes to verify and validate tickets at the door</p>
      </div>

      <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7">

          <!-- Camera Scanner -->
          <div class="scanner-card mb-4">
            <div class="scanner-card-header">
              <h2>Camera Scanner</h2>
              <p>Point camera at ticket QR code</p>
            </div>
            <div class="scanner-card-body">
              <div id="reader"></div>
              <div id="scanResult" class="scan-result"></div>
              <div class="d-flex gap-2 mt-3">
                <button id="btnStartScan" class="btn-auth rounded-3" style="flex:1">▶ Start Camera</button>
                <button id="btnStopScan" class="btn btn-secondary rounded-3 d-none" style="flex:1" onclick="stopScanner()">⏹ Stop</button>
              </div>
            </div>
          </div>

          <!-- Manual Entry -->
          <div class="scanner-card">
            <div class="scanner-card-header" style="background:linear-gradient(135deg,#1e293b,#334155)">
              <h2>Manual Verification</h2>
              <p>Enter ticket token manually if camera is unavailable</p>
            </div>
            <div class="scanner-card-body">
              <div class="mb-3">
                <label class="form-label fw-600 small">Ticket Token</label>
                <input id="manualToken" class="form-control" placeholder="Paste ticket token here..." />
              </div>
              <div class="mb-3">
                <label class="form-label fw-600 small">Signature</label>
                <input id="manualSig" class="form-control" placeholder="Paste ticket signature here..." />
              </div>
              <button onclick="verifyManual()" class="btn-auth rounded-3" style="background:linear-gradient(135deg,#1e293b,#334155)">🔍 Verify Ticket</button>
              <div id="manualResult" class="scan-result mt-3"></div>
            </div>
          </div>

          <!-- Scan History -->
          <div class="admin-table-wrap mt-4" id="historyWrap" style="display:none">
            <div class="admin-table-header">
              <h3>Scan History (This Session)</h3>
              <button onclick="clearHistory()" class="btn btn-sm btn-outline-danger">Clear</button>
            </div>
            <div style="max-height:300px;overflow-y:auto">
              <table class="admin-table">
                <thead>
                  <tr><th>Time</th><th>Result</th><th>Message</th></tr>
                </thead>
                <tbody id="historyBody"></tbody>
              </table>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    const token = sessionStorage.getItem('token');
    let scanner = null;
    let scanHistory = [];
    let scanning = false;

    function showToast(message, type = 'info') {
      const icons = { success: '✅', error: '❌', info: 'ℹ️', warning: '⚠️' };
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast-item toast-${type}`;
      toast.innerHTML = `<span class="toast-icon">${icons[type]}</span><span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => { toast.style.animation = 'toastOut 0.3s ease forwards'; setTimeout(() => toast.remove(), 300); }, 4000);
    }

    function doLogout() {
      sessionStorage.removeItem('token');
      window.location = '/login.html';
    }

    function addHistory(success, message) {
      const now = new Date().toLocaleTimeString();
      scanHistory.unshift({ time: now, success, message });
      const wrap = document.getElementById('historyWrap');
      const body = document.getElementById('historyBody');
      wrap.style.display = 'block';
      body.innerHTML = scanHistory.slice(0, 20).map(h => `
        <tr>
          <td>${h.time}</td>
          <td><span class="status-badge ${h.success ? 'status-active' : 'status-cancelled'}">${h.success ? '✅ Valid' : '❌ Invalid'}</span></td>
          <td>${h.message}</td>
        </tr>
      `).join('');
    }

    function clearHistory() {
      scanHistory = [];
      document.getElementById('historyBody').innerHTML = '';
      document.getElementById('historyWrap').style.display = 'none';
    }

    async function verifyTicket(tokenStr, signature) {
      try {
        const res = await fetch('/api/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: tokenStr, signature })
        });
        const d = await res.json();
        return { ok: res.ok, message: d.message };
      } catch {
        return { ok: false, message: 'Server error' };
      }
    }

    function showScanResult(el, ok, message) {
      el.className = 'scan-result ' + (ok ? 'success' : 'error');
      el.innerHTML = (ok ? '✅ ' : '❌ ') + message;
    }

    // ── Camera scanner ──────────────────────────────────
    function startScanner() {
      if (scanning) return;
      const resultEl = document.getElementById('scanResult');
      resultEl.className = 'scan-result';
      resultEl.textContent = '';

      scanner = new Html5QrcodeScanner('reader', {
        fps: 10,
        qrbox: { width: 280, height: 280 },
        rememberLastUsedCamera: true,
        showTorchButtonIfSupported: true
      });

      scanning = true;
      document.getElementById('btnStartScan').classList.add('d-none');
      document.getElementById('btnStopScan').classList.remove('d-none');

      scanner.render(
        async (decoded) => {
          try {
            const payload = JSON.parse(decoded);
            if (!payload.t || !payload.s) {
              showScanResult(resultEl, false, 'Invalid QR code format');
              addHistory(false, 'Invalid QR format');
              showToast('Invalid QR code', 'error');
              return;
            }

            showScanResult(resultEl, true, 'Verifying...');
            scanner.pause();

            const result = await verifyTicket(payload.t, payload.s);
            showScanResult(resultEl, result.ok, result.message);
            addHistory(result.ok, result.message);
            showToast(result.message, result.ok ? 'success' : 'error');

            // Auto resume after 3 seconds
            setTimeout(() => {
              resultEl.className = 'scan-result';
              resultEl.textContent = '';
              if (scanner) scanner.resume();
            }, 3000);
          } catch {
            showScanResult(resultEl, false, 'Could not parse QR data');
            addHistory(false, 'Parse error');
          }
        },
        (err) => {
          // Ignore scan errors (no QR in frame is normal)
        }
      );
    }

    function stopScanner() {
      if (scanner) {
        scanner.clear().catch(() => {});
        scanner = null;
      }
      scanning = false;
      document.getElementById('btnStartScan').classList.remove('d-none');
      document.getElementById('btnStopScan').classList.add('d-none');
      document.getElementById('reader').innerHTML = '';
    }

    document.getElementById('btnStartScan').addEventListener('click', startScanner);

    // ── Manual verify ───────────────────────────────────
    async function verifyManual() {
      const t = document.getElementById('manualToken').value.trim();
      const s = document.getElementById('manualSig').value.trim();
      const resultEl = document.getElementById('manualResult');

      if (!t || !s) {
        showScanResult(resultEl, false, 'Please enter both token and signature');
        return;
      }

      showScanResult(resultEl, true, 'Verifying...');
      const result = await verifyTicket(t, s);
      showScanResult(resultEl, result.ok, result.message);
      addHistory(result.ok, result.message);
      showToast(result.message, result.ok ? 'success' : 'error');
    }

    document.getElementById('manualToken').addEventListener('keydown', e => { if (e.key === 'Enter') verifyManual(); });

    // ── Auth guard ──────────────────────────────────────
    (function init() {
      if (!token) { window.location = '/login.html'; return; }
      try {
        const payload = JSON.parse(atob(token.split('.')[1]));
        if (payload.role !== 'admin') {
          alert('Access denied: Admin only');
          window.location = '/';
        }
      } catch {
        window.location = '/login.html';
      }
    })();
  </script>
</body>
</html>
