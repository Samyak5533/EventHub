<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Tickets — EventHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/styles.css" rel="stylesheet" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid px-4">
      <a class="navbar-brand" href="/">🎟 EventHub</a>
      <div class="d-flex align-items-center gap-2">
        <a href="/" class="btn btn-sm btn-nav-login">Browse Events</a>
        <button onclick="doLogout()" class="btn btn-sm" style="background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.6);border:1px solid rgba(255,255,255,0.15);border-radius:20px;font-size:0.78rem;padding:0.25rem 0.9rem">Logout</button>
      </div>
    </div>
  </nav>

  <!-- PAGE HEADER -->
  <div class="page-header">
    <div class="container">
      <h1>🎟 My Tickets</h1>
      <p>Your booked events and QR tickets — scan at the door for entry</p>
    </div>
  </div>

  <!-- CONTENT -->
  <div class="container tickets-page">

    <!-- Loading state -->
    <div id="loadingState" class="text-center py-5">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="mt-3 text-muted">Loading your tickets...</p>
    </div>

    <!-- Empty state -->
    <div id="emptyState" class="empty-state d-none">
      <div class="empty-icon">🎭</div>
      <h3>No Tickets Yet</h3>
      <p>You haven't booked any tickets yet. Browse events and grab your first ticket!</p>
      <a href="/" class="btn btn-primary-grad mt-3">Browse Events</a>
    </div>

    <!-- Tickets list -->
    <div id="ticketsList" class="d-flex flex-column gap-3 d-none"></div>

  </div>

  <!-- FOOTER -->
  <footer class="site-footer">
    <span class="footer-brand">🎟 EventHub</span>
    <p>Secure QR-Based Event Ticketing &copy; 2026</p>
  </footer>

  <div class="toast-container" id="toastContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function showToast(message, type = 'info') {
      const icons = { success: '✅', error: '❌', info: 'ℹ️', warning: '⚠️' };
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast-item toast-${type}`;
      toast.innerHTML = `<span class="toast-icon">${icons[type]}</span><span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => { toast.style.animation = 'toastOut 0.3s ease forwards'; setTimeout(() => toast.remove(), 300); }, 3500);
    }

    function doLogout() {
      sessionStorage.removeItem('token');
      window.location = '/login.html';
    }

    function downloadQR(dataUrl, eventName) {
      const a = document.createElement('a');
      a.href = dataUrl;
      a.download = `ticket-${eventName.replace(/\s+/g, '-').toLowerCase()}.png`;
      a.click();
    }

    function getStatusBadge(status) {
      const map = {
        active: '<span class="status-badge status-active">✅ Active</span>',
        used: '<span class="status-badge status-used">✔ Used</span>',
        cancelled: '<span class="status-badge status-cancelled">✕ Cancelled</span>'
      };
      return map[status] || map['active'];
    }

    async function loadTickets() {
      const token = sessionStorage.getItem('token');
      if (!token) { window.location = '/login.html'; return; }

      try {
        const res = await fetch('/api/bookings/tickets/my', {
          headers: { 'Authorization': 'Bearer ' + token }
        });

        document.getElementById('loadingState').classList.add('d-none');

        if (!res.ok) {
          if (res.status === 401) { window.location = '/login.html'; return; }
          showToast('Failed to load tickets', 'error');
          document.getElementById('emptyState').classList.remove('d-none');
          return;
        }

        const tickets = await res.json();

        if (!tickets.length) {
          document.getElementById('emptyState').classList.remove('d-none');
          return;
        }

        const list = document.getElementById('ticketsList');
        list.classList.remove('d-none');

        tickets.forEach((t, idx) => {
          const dateStr = new Date(t.date_time).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
          const timeStr = new Date(t.date_time).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
          const issuedStr = new Date(t.issued_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

          const card = document.createElement('div');
          card.className = 'ticket-card';
          card.innerHTML = `
            <div class="ticket-stub"></div>
            <div class="ticket-body">
              <div class="ticket-info">
                <div class="ticket-event-name">${t.event}</div>
                <div class="ticket-meta">
                  <span>📅 ${dateStr}</span>
                  <span>🕐 ${timeStr}</span>
                  <span>🗓 Issued: ${issuedStr}</span>
                </div>
                <div class="d-flex align-items-center gap-2 flex-wrap">
                  ${getStatusBadge(t.status)}
                  <span style="font-size:0.78rem;color:var(--text-muted)">Ticket #${t.ticket_id.slice(0,8).toUpperCase()}</span>
                </div>
                ${t.status === 'active' ? `
                  <div class="mt-2 p-2 rounded-2" style="background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.2);font-size:0.8rem;color:#16a34a">
                    🔐 Valid for entry — Show QR code at the door
                  </div>` : ''}
              </div>
              <div class="ticket-divider d-none d-md-block"></div>
              <div class="ticket-qr">
                ${t.qr ? `
                  <img src="${t.qr}" alt="QR Code" id="qr-${idx}" />
                  <div class="ticket-qr-label">Scan for entry</div>
                  <button class="btn-download-qr" onclick="downloadQR('${t.qr}', '${t.event.replace(/'/g, "\\'")}')">⬇ Download</button>
                ` : '<div style="width:120px;height:120px;background:var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:0.75rem;color:var(--text-muted)">QR N/A</div>'}
              </div>
            </div>
          `;
          list.appendChild(card);
        });

      } catch (err) {
        console.error(err);
        document.getElementById('loadingState').classList.add('d-none');
        document.getElementById('emptyState').classList.remove('d-none');
        showToast('Could not load tickets', 'error');
      }
    }

    loadTickets();
  </script>
</body>
</html>
