<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign Up — EventHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/styles.css" rel="stylesheet" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="brand">🎟 EventHub</div>
        <p>Join thousands of event lovers</p>
      </div>

      <h2>Create Account</h2>
      <p class="subtitle">Start booking secure, QR-verified tickets instantly</p>

      <div id="alert" class="alert alert-danger d-none py-2 mb-3" style="border-radius:10px;font-size:0.875rem"></div>

      <div class="form-group">
        <label class="form-label">Full Name</label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input id="name" type="text" class="form-input" placeholder="Your full name" autocomplete="name" />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Email Address</label>
        <div class="input-wrapper">
          <span class="input-icon">✉️</span>
          <input id="email" type="email" class="form-input" placeholder="you@email.com" autocomplete="email" />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input id="password" type="password" class="form-input" placeholder="At least 6 characters" autocomplete="new-password" oninput="checkStrength(this.value)" />
        </div>
        <div class="password-strength mt-1">
          <div class="password-strength-bar" id="strengthBar"></div>
        </div>
        <small id="strengthText" class="text-muted" style="font-size:0.75rem"></small>
      </div>

      <button id="btnRegister" type="button" style="display:block;width:100%;background:linear-gradient(135deg,#6C63FF,#FF6584);color:white;border:none;border-radius:12px;padding:0.8rem;font-size:1rem;font-weight:700;cursor:pointer;margin-top:0.5rem;box-shadow:0 4px 15px rgba(108,99,255,0.35);">Create My Account</button>

      <div class="auth-divider">or</div>

      <div class="auth-footer">
        Already have an account?
        <a href="/login.html" class="fw-700" style="color:var(--primary)">Sign in →</a>
      </div>

      <div class="text-center mt-3">
        <a href="/" style="font-size:0.8rem;color:var(--text-muted)">← Back to Events</a>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    function showToast(message, type = 'info') {
      const icons = { success: '✅', error: '❌', info: 'ℹ️', warning: '⚠️' };
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast-item toast-${type}`;
      toast.innerHTML = `<span class="toast-icon">${icons[type]}</span><span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => { toast.style.animation = 'toastOut 0.3s ease forwards'; setTimeout(() => toast.remove(), 300); }, 3500);
    }

    function checkStrength(val) {
      const bar = document.getElementById('strengthBar');
      const text = document.getElementById('strengthText');
      if (!val) { bar.style.width = '0%'; text.textContent = ''; return; }
      let score = 0;
      if (val.length >= 6) score++;
      if (val.length >= 10) score++;
      if (/[A-Z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;
      const levels = [
        { pct: '20%', color: '#ef4444', label: 'Very Weak' },
        { pct: '40%', color: '#f97316', label: 'Weak' },
        { pct: '60%', color: '#eab308', label: 'Fair' },
        { pct: '80%', color: '#22c55e', label: 'Strong' },
        { pct: '100%', color: '#16a34a', label: 'Very Strong' },
      ];
      const lvl = levels[Math.min(score - 1, 4)] || levels[0];
      bar.style.width = lvl.pct;
      bar.style.background = lvl.color;
      text.textContent = lvl.label;
      text.style.color = lvl.color;
    }

    async function doRegister() {
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('password').value;
      const alertEl = document.getElementById('alert');
      const btn = document.getElementById('btnRegister');
      alertEl.classList.add('d-none');

      if (!name || !email || !pass) {
        alertEl.textContent = 'Please fill all fields.';
        alertEl.classList.remove('d-none');
        return;
      }
      if (pass.length < 6) {
        alertEl.textContent = 'Password must be at least 6 characters.';
        alertEl.classList.remove('d-none');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Creating account...';

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password: pass })
        });
        const j = await res.json();
        if (j.token) {
          sessionStorage.setItem('token', j.token);
          showToast(`Welcome to EventHub, ${name}! 🎟`, 'success');
          setTimeout(() => window.location = '/', 900);
        } else {
          alertEl.textContent = j.message || 'Registration failed';
          alertEl.classList.remove('d-none');
          btn.disabled = false;
          btn.textContent = 'Create My Account';
        }
      } catch {
        alertEl.textContent = 'Server error. Please try again.';
        alertEl.classList.remove('d-none');
        btn.disabled = false;
        btn.textContent = 'Create My Account';
      }
    }

    document.getElementById('btnRegister').addEventListener('click', doRegister);
    document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') doRegister(); });

    if (sessionStorage.getItem('token')) window.location = '/';
  </script>
</body>
</html>
