<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Events - EventHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/styles.css" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">EventHub</a>
    </div>
  </nav>
  <main class="container py-4">
    <h2>Events</h2>
    <div class="row mb-3">
      <div class="col-md-4">
        <select id="categoryFilter" class="form-select">
          <option value="">All Categories</option>
          <option>Sports</option>
          <option>Concerts</option>
          <option>Stand-up comedy</option>
          <option>Dating events</option>
          <option>Webinars</option>
          <option>Music</option>
          <option>Dance</option>
          <option>Other</option>
        </select>
      </div>
      <div class="col-md-8">
        <input id="search" class="form-control" placeholder="Search events" />
      </div>
    </div>
    <div id="eventsList" class="row"></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/events.js"></script>
</body>
</html>
