# Render blueprint: https://render.com/docs/blueprint-spec
# In Render, choose New → Blueprint and pick this repo.
services:
  - type: web
    name: eventhub
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY
        value: "1"
      # Render generates these once and keeps them, so logins and QR codes
      # stay valid across deploys.
      - key: JWT_SECRET
        generateValue: true
      - key: TICKET_SECRET
        generateValue: true
